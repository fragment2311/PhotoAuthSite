services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DH_USER:-fragment213}/${APP_REPO:-photoauthapp}:${APP_TAG:-prod}
    ports:
      - "27017:27017"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:27017/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
