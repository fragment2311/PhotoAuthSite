services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fragment213/photoauthapp:prod
    ports:
      - "8082:8082"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
