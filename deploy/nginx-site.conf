# ===== Stage 1: composer =====
FROM composer:2 AS vendor
ENV COMPOSER_ALLOW_SUPERUSER=1
WORKDIR /app
COPY composer.json composer.lock ./
RUN composer install --no-dev --no-scripts --no-progress --no-interaction --prefer-dist --ignore-platform-req=ext-ftp
COPY . .
RUN composer dump-autoload --optimize

# ===== Stage 2: runtime (Apache + PHP) =====
FROM php:8.2-apache-bookworm

# Пакеты и расширения PHP
RUN apt-get update && apt-get install -y --no-install-recommends \
      libzip-dev unzip git mc \
  && docker-php-ext-install pdo_mysql zip \
  && a2enmod rewrite headers \
  && rm -rf /var/lib/apt/lists/*

# Apache слушает 8082
RUN sed -ri "s/^Listen 80$/Listen 8082/" /etc/apache2/ports.conf || echo "Listen 8082" >> /etc/apache2/ports.conf

# Полный vhost под Laravel (DocumentRoot=public, DirectoryIndex=index.php, rewrite внутри <Directory>)
RUN set -eux; \
  printf '%s\n' \
  '<VirtualHost *:8082>' \
  '    ServerName localhost' \
  '    DocumentRoot /var/www/html/public' \
  '    DirectoryIndex index.php' \
  '' \
  '    <Directory /var/www/html/public>' \
  '        Options FollowSymLinks' \
  '        AllowOverride None' \
  '        Require all granted' \
  '        <IfModule mod_rewrite.c>' \
  '            RewriteEngine On' \
  '            RewriteCond %{REQUEST_FILENAME} !-f' \
  '            RewriteCond %{REQUEST_FILENAME} !-d' \
  '            RewriteRule ^ index.php [L]' \
  '        </IfModule>' \
  '    </Directory>' \
  '' \
  '    ErrorLog ${APACHE_LOG_DIR}/error.log' \
  '    CustomLog ${APACHE_LOG_DIR}/access.log combined' \
  '</VirtualHost>' \
  > /etc/apache2/sites-available/000-default.conf; \
  printf 'ServerName localhost\n' > /etc/apache2/conf-available/servername.conf; \
  a2enconf servername >/dev/null 2>&1 || true

WORKDIR /var/www/html
# Копируем код из vendor-стадии
COPY --chown=www-data:www-data --from=vendor /app ./

# Права и обязательные каталоги (Blade/кэш/логи)
RUN set -eux; \
  chown -R www-data:www-data /var/www/html; \
  mkdir -p storage/app/public \
           storage/framework/{cache,sessions,views} \
           storage/logs \
           bootstrap/cache; \
  chmod -R ug+rwX storage bootstrap/cache

EXPOSE 8082
