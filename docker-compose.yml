services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # базовый тег, который всегда есть
    image: fragment213/viewentrance:prod
    container_name: viewentrance-app
    ports:
      - "8082:8082"        # 8082 снаружи → 8082 в контейнере
    env_file:
      - .env               # APP_URL=http://localhost:8082 рекомендовано
    restart: unless-stopped
    # в DEV можно монтировать код, но следи за структурой public/
    # volumes:
    #   - .:/var/www/html
